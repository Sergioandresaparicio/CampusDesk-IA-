# ===================================================================
# CampusDesk Backend - Local Environment Configuration
# ===================================================================

spring.application.name=campusdesk-backend

# Server Port (8051 matches Frontend and verified free in local audit)
server.port=${SERVER_PORT:8051}

# ===================================================================
# Database Configuration (PostgreSQL / Local H2 PostgreSQL Compatibility)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/campusdesk;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin123}

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.auto_quote_keyword=true
spring.jpa.open-in-view=false

# ===================================================================
# Security & Bootstrap
# ===================================================================
app.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap.username=${ADMIN_USERNAME:superadmin}
app.bootstrap.email=${ADMIN_EMAIL:superadmin@localhost}
app.bootstrap.password=${ADMIN_PASSWORD:SuperAdmin123!}

# JWT Configuration (HMAC256)
security.jwt.secret=${JWT_SECRET:0fb5a8994cde705e2f45ca46921f00bffa60fdcb17ee9eecbcfed06574fa38d7}
security.jwt.issuer=${JWT_ISSUER:campusdesk-auth-issuer}
security.jwt.expiration=${JWT_EXPIRATION:15d}

# ===================================================================
# n8n Machine-to-Machine (M2M) & Webhook Integration
# ===================================================================
n8n.webhook.url=${N8N_WEBHOOK_URL:http://localhost:5678/webhook/campusdesk-incident}
n8n.api-key=${N8N_API_KEY:campusdesk-n8n-m2m-secret-key-2026}

# ===================================================================
# OpenAPI / Swagger Documentation
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
